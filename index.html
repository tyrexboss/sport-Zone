<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sport Zone – Plan du magasin</title>
<style>
:root{--violet:#39245b;--violet2:#6b4a91;--bg:#f5f3f8;--ink:#211b2b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--violet);color:white;padding:24px 18px;text-align:center}
header strong{letter-spacing:2px;font-size:14px}header h1{margin:10px 0 6px;font-size:28px}header p{margin:0;color:#e8e0f0}
main{max-width:900px;margin:24px auto;padding:0 16px}
.search{width:100%;padding:15px;border:1px solid #d9d2e2;border-radius:12px;font-size:16px;margin-bottom:16px}
h2{font-size:20px;margin:18px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button.card{background:white;border:1px solid #e1dbe8;border-radius:14px;padding:18px;text-align:left;cursor:pointer;min-height:90px;color:var(--ink)}
button.card:hover,button.card:focus{border-color:var(--violet2);outline:2px solid #d8c8ea}
.card b{display:block;font-size:18px;margin-bottom:6px}.card span{font-size:13px;color:#625a6b}
#details{display:none;background:white;border-left:5px solid var(--violet2);border-radius:12px;padding:18px;margin-top:18px;box-shadow:0 3px 14px #211b2b12}
#details h3{margin:0 0 8px}#details ul{padding-left:20px;line-height:1.8}
.place{font-weight:bold;color:var(--violet);background:#f0eaf7;padding:10px 12px;border-radius:8px;display:inline-block}
footer{text-align:center;color:#6b6472;font-size:12px;padding:26px 12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><strong>SPORT ZONE</strong><h1>Plan interactif du magasin</h1><p>Trouvez rapidement votre rayon et vos produits.</p></header>
<main>
<input id="search" class="search" type="search" placeholder="Rechercher un produit (ex. crampons, haltères…)" aria-label="Rechercher un produit">
<h2>Choisissez un univers</h2>
<div class="grid" id="grid"></div>
<section id="details" aria-live="polite"></section>
</main>
<footer>Maquette pédagogique – emplacements fictifs, à adapter au magasin.</footer>
<script>
const univers=[
{name:"Running",desc:"Course à pied et entraînement",place:"Allée A1",items:["Chaussures de running","Vêtements de course","Montres GPS","Chaussettes techniques"]},
{name:"Football",desc:"Équipements et sports collectifs",place:"Allée B2",items:["Crampons","Ballons","Maillots","Protège-tibias"]},
{name:"Musculation",desc:"Renforcement et fitness",place:"Allée C1",items:["Haltères","Bancs de musculation","Élastiques","Tapis de sol"]},
{name:"Randonnée",desc:"Équipement outdoor",place:"Allée D2",items:["Chaussures de randonnée","Sacs à dos","Bâtons de marche","Vestes imperméables"]},
{name:"Natation",desc:"Natation et activités aquatiques",place:"Allée E1",items:["Lunettes de natation","Maillots de bain","Palmes","Bonnets"]},
{name:"Cyclisme",desc:"Vélos et accessoires",place:"Allée F1",items:["Vélos","Casques","Gants","Éclairage vélo"]}
];
const grid=document.getElementById("grid"), details=document.getElementById("details"), search=document.getElementById("search");
function show(u,match=""){details.style.display="block";details.innerHTML=`<h3>Univers ${u.name}</h3><p>${u.desc}</p><ul>${u.items.map(x=>`<li>${x}</li>`).join("")}</ul><p class="place">Emplacement : ${u.place}</p><p style="font-size:12px;color:#6b6472">Emplacement fictif pour la démonstration.</p>`;details.scrollIntoView({behavior:"smooth",block:"nearest"});}
univers.forEach(u=>{const b=document.createElement("button");b.className="card";b.innerHTML=`<b>${u.name}</b><span>${u.desc}</span>`;b.onclick=()=>show(u);grid.appendChild(b)});
search.addEventListener("input",()=>{const q=search.value.trim().toLocaleLowerCase("fr");if(!q){details.style.display="none";return}const u=univers.find(x=>x.items.some(i=>i.toLocaleLowerCase("fr").includes(q))||x.name.toLocaleLowerCase("fr").includes(q));if(u)show(u);else{details.style.display="block";details.innerHTML="<b>Aucun produit trouvé.</b><p>Essayez un autre mot-clé.</p>"}});
</script>
</body></html>
